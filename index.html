<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Mindar WebAR Projem</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

    <a-scene mindar-image="imageTargetSrc:./targets.mind;" color-space="sRGB" renderer="colorManagement: true, sortObjects: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-asset-item id="mindar" src=".R2.glb"></a-asset-item>
  </a-assets>
      </a-entity>

    </a-scene>

</body>
</html>
<div id="ui-overlay">
      <img src="R2.png" alt="Scan Target">
      <p>Please point your camera at this image to start the AR experience.</p>
    </div>

   
    <a-scene mindar-image="imageTargetSrc: R2.png;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>


      <a-entity id="ar-target" mindar-image-target="targetIndex: 0">
        

        <a-gltf-model rotation="0 0 0" position="0 0 0" scale="0.05 0.05 0.05" src="./modeliniz.gltf"></a-gltf-model>

      </a-entity>
    </a-scene>
 <a-assets>
        <img id="mindar" src="R2.png" crossorigin="anonymous">
      </a-assets>

      <a-marker
        type="pattern"
        url="pattern-marker.patt"
        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5"
        emitevents="true">

        <a-image
          src="#marker"
          rotation="-90 0 0"
          position="0 0.01 0"
          width="2.4"
          height="1.6"
          opacity="1">
   
    <script>
      const targetEntity = document.querySelector('#ar-target');
      const overlay = document.querySelector('#ui-overlay');

      targetEntity.addEventListener("targetFound", event => 
        overlay.style.opacity = "0"; 
        setTimeout(() => { overlay.style.display = "none"; }, 500)

      targetEntity.addEventListener("targetLost", event => 
        overlay.style.display = "flex";
        setTimeout(() => { overlay.style.opacity = "1"; }, 10)
          
    </script>

  </body>
</html>
